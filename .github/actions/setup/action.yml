name: Setup workspace
description: Installs Bun at the version pinned in package.json, restores the Bun and Turbo caches, and installs dependencies.

inputs:
  turbo-cache:
    description: Name of the Turbo cache to restore and save, one per job so parallel jobs never overwrite each other. Empty skips the Turbo cache.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json

    - name: Cache Bun install
      uses: actions/cache@v6
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-

    # Keyed on the commit so every run saves its new entries; the restore falls back to the latest
    # cache for the same lockfile, which a lockfile change deliberately starts from scratch.
    - name: Cache Turbo
      if: inputs.turbo-cache != ''
      uses: actions/cache@v6
      with:
        path: ${{ env.TURBO_CACHE_DIR }}
        key: turbo-${{ runner.os }}-${{ inputs.turbo-cache }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
        restore-keys: turbo-${{ runner.os }}-${{ inputs.turbo-cache }}-${{ hashFiles('bun.lock') }}-

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
